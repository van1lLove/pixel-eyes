name: Community eyes submissions
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to validate and preview
        required: true
        type: string
permissions: {}
concurrency:
  group: skin-submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.action == 'opened' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 community/process_submission.py
        env:
          GH_TOKEN: ${{ github.token }}
  propose:
    if: github.event.action == 'labeled' && github.event.label.name == 'approved-skin' && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 community/process_submission.py
        env:
          GH_TOKEN: ${{ github.token }}
